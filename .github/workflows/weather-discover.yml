name: weather discover (one-off)

# 天候ドライバー（Open-Meteo ERA5）の取得形式と、前月差方向への寄与を
# 探索する一時ワークフロー（手動実行）。実装確定後は削除してよい。
on:
  workflow_dispatch:

jobs:
  discover:
    name: Discover weather driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Run weather discovery
        run: uv run python scripts/weather_discover.py
