name: e-Stat discover (one-off)

# statsDataId と品目コードを探索する一時ワークフロー（手動実行）。
# 実行ログに表ID・コードを印字する（appId は印字しない）。
# registry 確定後は不要になったら削除してよい。
on:
  workflow_dispatch:

jobs:
  discover:
    name: Discover statsDataId
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Run e-Stat discovery
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: uv run python scripts/estat_discover.py
