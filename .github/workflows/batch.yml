name: Batch (refresh artifacts)

# 定期バッチ: 公的API/先物からデータを取得 → DuckDB → 成果物JSONを生成し、
# public/data/*.json の差分のみをこのブランチにコミットする。
#
# 手動実行（workflow_dispatch）に加え、週次（毎週月曜 10:00 JST）で自動実行する。
# スケジュールはリポジトリのデフォルトブランチ上のワークフローのみ発火する
# （このブランチが現在のデフォルト）。ESTAT_APP_ID など前提条件は登録済み。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"   # 毎週月曜 01:00 UTC = 10:00 JST（最新の月次・先物・天候を取得）

permissions:
  contents: write

concurrency:
  group: batch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Run ETL into DuckDB
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: uv run python -m etl.run --db data/warehouse.duckdb

      - name: Build artifacts
        run: uv run python -m models.build_artifacts --db data/warehouse.duckdb --out public/data

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "No artifact changes."
          else
            git add public/data/*.json
            git commit -m "chore(data): refresh artifacts [skip ci]"
            git push
          fi
