[project]
name = "consumption-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "duckdb>=1.0",
  "statsmodels>=0.14",
  "httpx>=0.27",
  "pydantic>=2.7",
  "yfinance>=0.2.40",
  "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
